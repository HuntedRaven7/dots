# docker-compose.llama.yml
# llama.cpp server with CUDA GPU support.
#
# Usage:
#   podman compose -f containers/docker-compose.llama.yml up -d
#   docker compose -f containers/docker-compose.llama.yml up -d
#
# Download a model into the volume:
#   docker compose -f containers/docker-compose.llama.yml run --rm llama \
#     llama download <huggingface-repo> <file.gguf>

services:
  llama:
    build:
      context: ../..
      dockerfile: containers/ai/Containerfile.ai
    image: llama-cuda
    container_name: llama
    restart: unless-stopped
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - llama-models:/opt/models
    environment:
      # Keep Hugging Face downloads inside the named llama-models volume
      # (/opt/models) so the model persists across container lifecycles
      # instead of an ephemeral anonymous volume.
      HF_HOME: /opt/models/.cache/huggingface
      HF_HUB_CACHE: /opt/models/.cache/huggingface/hub
      HOME: /opt/models

    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "999"
      - "--ctx-size"
      - "8192"
      - "--cont-batching"
      - "--flash-attn"
      - "auto"

volumes:
  llama-models:
