services:
  hermes-vllm:
    build: .
    image: hermes-vllm:latest
    container_name: hermes-vllm
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface:Z
    command:
      - "--model"
      - "NousResearch/Hermes-3-Llama-3.1-8B"   # swap for the size/variant you want
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--dtype"
      - "auto"
      - "--gpu-memory-utilization"
      - "0.90"
      # - "--tensor-parallel-size"
      # - "2"                                  # uncomment + set for multi-GPU
    devices:
      - nvidia.com/gpu=all   # requires CDI spec generated (see README)
    security_opt:
      - label=disable        # skip on non-SELinux hosts

volumes:
  hf-cache:
