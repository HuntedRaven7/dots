services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
      - ~/Documents/obsidian-vault:/opt/data/obsidian
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
